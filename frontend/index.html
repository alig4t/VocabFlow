<!doctype html>
<html lang="fa" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons (brand logo) -->
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/logo-flow-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/logo/logo-flow-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo/logo-flow-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/logo-flow-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/logo-flow-192.png" />
    <link rel="shortcut icon" href="/logo/logo-flow-64.png" />

    <!-- viewport-fit=cover: required so env(safe-area-inset-*) resolves to real
         values under the Android 15+ enforced edge-to-edge mode (and iOS notch). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Browser UI theme color (address bar). These match the exact CSS
         --background of the light/dark themes so there is no visible seam.
         The Android APK sets its status bar at runtime via @capacitor/status-bar. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080c16" />

    <meta name="description" content="وکب فلو — پلتفرم جامع یادگیری واژگان انگلیسی: واژه‌ها، افعال عبارتی و باهم‌آیی‌ها با فلش‌کارت دوطرفه و داشبورد پیشرفت شخصی." />

    <title>وکب فلو — یادگیری واژگان انگلیسی</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
