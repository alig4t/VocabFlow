apply plugin: 'com.android.application'

// Keep Android's embedded version in sync with the app's single version source.
def appVersionName = new groovy.json.JsonSlurper()
    .parse(rootProject.file('../package.json')).version.toString()
def appVersionParts = appVersionName =~ /^(0|[1-9]\d*)\.(0|[1-9]\d?)\.(0|[1-9]\d?)$/
if (!appVersionParts.matches()) {
    throw new GradleException('package.json version must be major.minor.patch with minor and patch between 0 and 99.')
}
// Example: 1.15.4 -> 11504. Each new release must increase package.json version.
def appVersionCode = appVersionParts.group(1).toBigInteger() * 10000 +
    appVersionParts.group(2).toInteger() * 100 + appVersionParts.group(3).toInteger()
if (appVersionCode < 1 || appVersionCode > 2100000000) {
    throw new GradleException('The calculated Android versionCode is outside the supported range.')
}

// Per-app build configuration. Never put the developer API secret here.
def billingProperties = new Properties()
def billingFile = rootProject.file('billing.local.properties')
if (billingFile.exists()) billingFile.withInputStream { billingProperties.load(it) }
def billingValue = { String name ->
    def value = billingProperties.getProperty(name, '')
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace "ir.vocabflow.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "ir.vocabflow.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode.intValue()
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'BAZAAR_RSA_PUBLIC_KEY', billingValue('bazaar.rsaPublicKey')
        buildConfigField 'String', 'BAZAAR_MONTHLY_SKU', billingValue('bazaar.monthlySku')
        buildConfigField 'String', 'BAZAAR_QUARTERLY_SKU', billingValue('bazaar.quarterlySku')
        buildConfigField 'String', 'BAZAAR_YEARLY_SKU', billingValue('bazaar.yearlySku')
        buildConfigField 'String', 'DEVELOPER_ACCESS_SECRET', billingValue('developer.secret')
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
